# Optional overlay that runs the AI analysis on Google Gemini through its
# OpenAI-compatible endpoint. Needs GEMINI_API_KEY in the environment or in a
# .env file next to this compose file (see .env.example):
#
#   docker compose -f docker-compose.yml -f docker-compose.gemini.yml up -d --build
#
# A hosted model plans a new question in well under a second, so the planner
# stays inside its latency budget even on cold questions.
#
# Gemini rate limits are per model (free tier: 15 requests/min each), so note
# analysis runs on a second model and is paced under that quota: re-indexing
# never competes with the professionals' questions for the planner's quota.

services:
  smart-query:
    environment:
      AI_ENABLED: "true"
      AI_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
      AI_COMPLETIONS_PATH: /chat/completions
      AI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY (environment or .env)}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash-lite}
      AI_ANALYSIS_MODEL: ${AI_ANALYSIS_MODEL:-gemini-3.1-flash-lite}
      AI_INDEXER_RPM: ${AI_INDEXER_RPM:-12}
      AI_TIMEOUT_MS: "20000"
      # 2 s response target: Flash-Lite answers in 0.4-1.3 s even with ten new
      # questions at once, execution takes tens of ms; leave the planner the rest.
      AI_PLAN_TIMEOUT_MS: ${AI_PLAN_TIMEOUT_MS:-1800}
