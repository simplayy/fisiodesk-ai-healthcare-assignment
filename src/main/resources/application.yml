spring:
  application:
    name: fisiodesk-smart-query
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/fisiodesk}
      # Create the indexes declared on the entities at startup (idempotent).
      auto-index-creation: true
  ai:
    openai:
      # Any OpenAI-compatible endpoint: OpenAI itself, OpenRouter, Azure, a local
      # Ollama (http://localhost:11434, key not needed) ...
      api-key: ${AI_API_KEY:not-needed}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        # Providers that expose the OpenAI protocol under a different prefix
        # (e.g. Gemini: base-url .../v1beta/openai, path /chat/completions).
        completions-path: ${AI_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
  http:
    client:
      connect-timeout: 5s
      read-timeout: ${AI_TIMEOUT_MS:20000}ms

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

smartquery:
  # Optional fixed "today" (yyyy-MM-dd) for relative windows like "ultimi 3 mesi".
  # Left empty, the latest calendar event in the database is used, which suits
  # the 2024 demo dataset. In production this would simply be the current date.
  reference-date: ${REFERENCE_DATE:}
  indexer:
    initial-delay-ms: 3000
    fixed-delay-ms: 30000
    # Pacing of the LLM calls made while indexing (0 = none). Keep it below the
    # provider's per-minute quota so a backlog is analyzed steadily.
    max-llm-calls-per-minute: ${AI_INDEXER_RPM:0}
  ai:
    # false = deterministic analyzer only, no LLM calls at all
    enabled: ${AI_ENABLED:false}
    # Max time a request waits for the LLM planner before answering with the
    # rule-based plan (the LLM plan is still stored for next time). Size it on
    # the response-time target minus execution (tens of ms): with a 2 s target
    # a hosted model can be given up to ~1.8 s.
    plan-timeout-ms: ${AI_PLAN_TIMEOUT_MS:1500}
    # Optional separate model for note analysis, so background indexing and
    # interactive planning draw on different provider quotas. Empty = same model.
    analysis-model: ${AI_ANALYSIS_MODEL:}
  warmup:
    # Pre-planned at startup so the first click in the UI is fast.
    questions:
      - "Mostra pazienti con dolore lombare che hanno mostrato miglioramento negli ultimi 3 mesi ma hanno saltato l'ultimo appuntamento"
      - "Pazienti con lombalgia che non mostrano miglioramento negli ultimi 3 mesi"
      - "Pazienti con cervicalgia in miglioramento negli ultimi 2 mesi"
      - "Chi ha saltato l'ultimo appuntamento?"

logging:
  level:
    org.mongodb.driver: warn
