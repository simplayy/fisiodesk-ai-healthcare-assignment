<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FisioDesk · Query intelligenti</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-mark">F</span>
        <div>
          <div class="brand-name">FisioDesk</div>
          <div class="brand-sub">Query intelligenti sui dati clinici</div>
        </div>
      </div>
      <div class="status" id="status">connessione…</div>
    </div>
  </header>

  <main class="container">
    <section class="search-card">
      <label for="question" class="search-label">Fai una domanda sui tuoi pazienti</label>
      <div class="search-row">
        <textarea id="question" rows="2" placeholder="Es. Mostra pazienti con dolore lombare che hanno mostrato miglioramento negli ultimi 3 mesi ma hanno saltato l'ultimo appuntamento">Mostra pazienti con dolore lombare che hanno mostrato miglioramento negli ultimi 3 mesi ma hanno saltato l'ultimo appuntamento</textarea>
        <button id="run" type="button">Cerca</button>
      </div>
      <div class="scope-row">
        <label for="professionista">Professionista</label>
        <select id="professionista">
          <option value="">Tutti (vista amministrativa)</option>
        </select>
        <button id="clear-cache" type="button" class="chip chip-action" title="Svuota risposte in cache e piani memorizzati: la prossima domanda passa di nuovo dall'AI">Svuota cache</button>
      </div>
      <div class="examples">
        <span>Esempi:</span>
        <button class="chip" data-q="Mostra pazienti con dolore lombare che hanno mostrato miglioramento negli ultimi 3 mesi ma hanno saltato l'ultimo appuntamento">query target</button>
        <button class="chip" data-q="Pazienti con lombalgia che non mostrano miglioramento negli ultimi 3 mesi">lombalgia senza miglioramento</button>
        <button class="chip" data-q="Pazienti con cervicalgia in miglioramento negli ultimi 2 mesi">cervicalgia in miglioramento</button>
        <button class="chip" data-q="Chi ha saltato l'ultimo appuntamento?">no-show recenti</button>
      </div>
    </section>

    <section id="plan-box" class="plan-box hidden">
      <div class="plan-title">Come ho interpretato la domanda</div>
      <div id="plan-chips" class="plan-chips"></div>
    </section>

    <section id="explain-box" class="explain hidden">
      <div class="explain-head">
        <div class="plan-title">Come è nato questo risultato</div>
        <span id="explain-total" class="results-meta"></span>
      </div>
      <ol id="pipeline" class="pipeline"></ol>
      <div class="explain-grid">
        <div>
          <div class="explain-sub">Parole della domanda riconosciute dal lessico</div>
          <div id="clues" class="clues"></div>
        </div>
        <div>
          <div class="explain-sub">Contesto</div>
          <ul id="context" class="context"></ul>
        </div>
      </div>
      <details id="excluded-box" class="excluded" open>
        <summary id="excluded-summary"></summary>
        <ul id="excluded"></ul>
      </details>
    </section>

    <section id="results"></section>
    <div id="toast" class="toast hidden"></div>
  </main>

  <footer class="container footer" id="footer"></footer>

  <script src="app.js"></script>
</body>
</html>
