<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FisioDesk · Query intelligenti</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-mark">F</span>
        <div>
          <div class="brand-name">FisioDesk</div>
          <div class="brand-sub">Query intelligenti sui dati clinici</div>
        </div>
      </div>
      <div class="topbar-tools">
        <label class="scope">
          <span>Professionista</span>
          <select id="professionista">
            <option value="">Tutti</option>
          </select>
        </label>
        <button id="clear-cache" type="button" class="link-btn" title="Svuota le risposte in cache e i piani memorizzati: la prossima domanda passa di nuovo dall'AI">Svuota cache</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="search-card">
      <div class="search-row">
        <textarea id="question" rows="2" placeholder="Fai una domanda sui tuoi pazienti">Mostra pazienti con dolore lombare che hanno mostrato miglioramento negli ultimi 3 mesi ma hanno saltato l'ultimo appuntamento</textarea>
        <button id="run" type="button">Cerca</button>
      </div>
      <div class="examples">
        <button class="chip" data-q="Mostra pazienti con dolore lombare che hanno mostrato miglioramento negli ultimi 3 mesi ma hanno saltato l'ultimo appuntamento">query target</button>
        <button class="chip" data-q="Pazienti con lombalgia che non mostrano miglioramento negli ultimi 3 mesi">lombalgia senza miglioramento</button>
        <button class="chip" data-q="Pazienti con cervicalgia in miglioramento negli ultimi 2 mesi">cervicalgia in miglioramento</button>
        <button class="chip" data-q="Chi ha saltato l'ultimo appuntamento?">no-show recenti</button>
      </div>
    </section>

    <section id="summary" class="summary hidden">
      <div class="summary-left">
        <span id="summary-count" class="summary-count"></span>
        <span id="summary-plan" class="summary-plan"></span>
      </div>
      <button id="explain-open" type="button" class="link-btn accent">Come è nato il risultato</button>
    </section>

    <section id="results"></section>
  </main>

  <dialog id="explain" class="explain" tabindex="-1">
    <div class="explain-head">
      <h2>Come è nato questo risultato</h2>
      <button id="explain-close" type="button" class="icon-btn" aria-label="Chiudi">×</button>
    </div>
    <p id="explain-question" class="explain-question"></p>

    <h3>Percorso</h3>
    <ol id="pipeline" class="pipeline"></ol>

    <h3>Interpretazione della domanda</h3>
    <div id="clues" class="clues"></div>

    <h3>Contesto</h3>
    <ul id="context" class="context"></ul>

    <div id="excluded-block" class="hidden">
      <h3 id="excluded-title"></h3>
      <ul id="excluded" class="excluded"></ul>
    </div>
  </dialog>

  <div id="toast" class="toast hidden"></div>
  <footer class="container footer" id="footer"></footer>
  <script src="app.js"></script>
</body>
</html>
