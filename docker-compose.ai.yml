# Optional overlay that runs the AI analysis on a fully local LLM (Ollama),
# so no API key or external service is needed:
#
#   docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d --build
#
# First start downloads the model (~1 GB). On CPU each note takes a few
# seconds to analyze; the indexer upgrades existing heuristic analyses in the
# background while the API stays available.

services:
  smart-query:
    environment:
      AI_ENABLED: "true"
      AI_BASE_URL: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-qwen2.5:1.5b}
      AI_TIMEOUT_MS: "90000"
      # A 1.5B model on CPU needs seconds: past the budget the rule parser
      # answers and the LLM plan is stored for next time.
      AI_PLAN_TIMEOUT_MS: ${AI_PLAN_TIMEOUT_MS:-1800}
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    container_name: fisiodesk-ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Keep the model resident: unloading it after idle time would add ~10s
      # to the first request after a pause.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks:
      - fisiodesk-network

  # Downloads the model into the shared volume, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: fisiodesk-ollama-pull
    entrypoint: ["/bin/sh", "-c"]
    command: ["OLLAMA_HOST=http://ollama:11434 ollama pull ${AI_MODEL:-qwen2.5:1.5b}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - fisiodesk-network

volumes:
  ollama_models:
