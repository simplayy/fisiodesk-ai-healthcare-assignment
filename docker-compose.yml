services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    container_name: fisiodesk-mongodb
    ports:
      # Bound to localhost: the database must not be reachable from outside the host.
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fisiodesk
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - mongodb_mongot:/data/mongot
    healthcheck:
      # Atlas Local runs as a single-node replica set: right after start the
      # node is still SECONDARY, so wait for it to become writable, not just up.
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - fisiodesk-network

  # Imports the sample dataset once MongoDB is reachable.
  mongodb-seed:
    image: mongodb/mongodb-atlas-local:8.0
    container_name: fisiodesk-mongodb-seed
    volumes:
      - ./data:/data
    command: >
      bash -c "
        mongoimport --host mongodb --db fisiodesk --collection pazienti --file /data/pazienti.json --jsonArray --mode upsert &&
        mongoimport --host mongodb --db fisiodesk --collection schede_valutazione --file /data/schede_valutazione.json --jsonArray --mode upsert &&
        mongoimport --host mongodb --db fisiodesk --collection diario_trattamenti --file /data/diario_trattamenti.json --jsonArray --mode upsert &&
        mongoimport --host mongodb --db fisiodesk --collection eventi_calendario --file /data/eventi_calendario.json --jsonArray --mode upsert &&
        echo 'Dati importati con successo'
      "
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - fisiodesk-network

  # Spring Boot API + web UI (http://localhost:8080)
  smart-query:
    build: .
    container_name: fisiodesk-smart-query
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongodb:27017/fisiodesk
      # Optional LLM integration (any OpenAI-compatible endpoint).
      # Leave AI_ENABLED=false to run fully on the deterministic analyzer.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      # Fixed "today" for the 2024 demo dataset; remove in a live system.
      REFERENCE_DATE: ${REFERENCE_DATE:-}
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-seed:
        condition: service_completed_successfully
    networks:
      - fisiodesk-network

  # Optional: MongoDB Express to browse the data (http://localhost:8081)
  mongo-express:
    image: mongo-express:latest
    container_name: fisiodesk-mongo-express
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - fisiodesk-network

volumes:
  mongodb_data:
  mongodb_config:
  mongodb_mongot:

networks:
  fisiodesk-network:
    driver: bridge
