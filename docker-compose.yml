services:
  mongodb:
    image: mongo:8.0
    container_name: fisiodesk-mongodb
    ports:
      # Bound to localhost: the database must not be reachable from outside the host.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok || quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - fisiodesk-network

  # Imports the sample dataset once MongoDB is reachable (idempotent upserts by _id).
  mongodb-seed:
    image: mongo:8.0
    container_name: fisiodesk-mongodb-seed
    volumes:
      - ./data:/seed:ro
    entrypoint: ["mongosh", "--quiet", "--host", "mongodb", "fisiodesk", "--eval"]
    command:
      - |
        const fs = require("fs");
        for (const c of ["pazienti", "schede_valutazione", "diario_trattamenti", "eventi_calendario"]) {
          const docs = EJSON.parse(fs.readFileSync("/seed/" + c + ".json", "utf8"));
          const r = db[c].bulkWrite(docs.map(d => ({ replaceOne: { filter: { _id: d._id }, replacement: d, upsert: true } })));
          print(c + ": " + docs.length + " documenti (" + r.upsertedCount + " nuovi)");
        }
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - fisiodesk-network

  # Spring Boot API + web UI (http://localhost:8080)
  smart-query:
    build: .
    container_name: fisiodesk-smart-query
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongodb:27017/fisiodesk
      # Optional LLM integration (any OpenAI-compatible endpoint).
      # Leave AI_ENABLED=false to run fully on the deterministic analyzer.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com}
      AI_COMPLETIONS_PATH: ${AI_COMPLETIONS_PATH:-/v1/chat/completions}
      AI_API_KEY: ${AI_API_KEY:-not-needed}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_ANALYSIS_MODEL: ${AI_ANALYSIS_MODEL:-}
      AI_INDEXER_RPM: ${AI_INDEXER_RPM:-0}
      # Fixed "today" for the 2024 demo dataset; remove in a live system.
      REFERENCE_DATE: ${REFERENCE_DATE:-}
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-seed:
        condition: service_completed_successfully
    networks:
      - fisiodesk-network

  # Optional: MongoDB Express to browse the data (http://localhost:8081)
  mongo-express:
    image: mongo-express:latest
    container_name: fisiodesk-mongo-express
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - fisiodesk-network

volumes:
  mongo_data:

networks:
  fisiodesk-network:
    driver: bridge
